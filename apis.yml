name: Tripp
description: >-
  TRIPP is a digital mental-wellness company whose consumer app delivers
  immersive, interactive meditation, breathwork and mood-management experiences
  across virtual-reality headsets (including Meta Quest and PlayStation VR) and
  mobile devices. It blends guided sessions, generative visuals, spatial audio
  and gamified "trips" to help people manage stress, focus, mood and sleep.
  Tripp is backed by Mayfield. As of this enrichment pass Tripp operates a
  consumer-facing application and an Intercom-powered help center but publishes
  no public developer API, SDK, or documentation portal; its web properties sit
  behind a bot-mitigation (captcha) wall, so no OpenAPI, llms.txt, or
  /.well-known discovery documents were retrievable.
